name: Generate audio

# Reads every article of the day's brief aloud with Supertonic 3 (runs here, no API) and saves the
# MP3s to Cloudflare R2, as soon as the other AIs have approved each article and never before (Will,
# 2 Nov 2026). bilinguist-data's start-audio.yml starts it:
#   "articles-approved": English native once it has passed its checks, then the other natives once
#     they have passed theirs. So natives have audio the second the brief is published.
#   "brief-ready": the final check has published the brief. Every level, and any native it changed.
# Two scheduled runs are a backup (GitHub runs them hours late). Every run skips articles already read
# from their current text, so extra runs cost nothing.
#
# A publish run: label what's already read, Global News on all machines, label, every other topic,
# label again + check.
on:
  repository_dispatch:
    types: [brief-ready, articles-approved]
  schedule:
    - cron: "45 6 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only this many articles (0 = all). A test run."
        default: "0"
      batches:
        description: "Machines per wave (max 20)"
        default: "20"
      again:
        description: "Read today's audio again, even what's already read (after a change to how it's said)"
        type: boolean
        default: false

concurrency:
  group: bb-audio
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPERTONIC_VERSION: "1.3.1"
  BB_DATA_URL: ${{ vars.BB_DATA_URL || 'https://api.bilinguistbrief.com' }}
  BB_CONTENT_KEY: ${{ secrets.BB_CONTENT_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      gn_matrix: ${{ steps.plan.outputs.gn_matrix }}
      rest_matrix: ${{ steps.plan.outputs.rest_matrix }}
      date: ${{ steps.plan.outputs.date }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The 385 MB model is downloaded once and cached, so the speak jobs don't each fetch it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-${{ env.SUPERTONIC_VERSION }}
      - name: Warm the model cache
        run: python -c "from supertonic import TTS; TTS(model='supertonic-3')"
      - id: plan
        name: Plan today's waves
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python bb_audio.py plan --batches "${{ inputs.batches || 20 }}" --limit "${{ inputs.limit || 0 }}" ${{ inputs.again && '--again' || '' }} ${{ github.event.action == 'articles-approved' && '--approved' || (github.event.action == 'brief-ready' && '--wait 10' || '') }}
      # Whatever the final check couldn't label in its own push (it was read just too late)
      - name: Label what's already read
        if: steps.plan.outputs.source == 'brief'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python bb_audio.py label
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.date != ''
        with:
          name: plan
          path: plan.json
          retention-days: 2

  # On an "articles-approved" run, this wave is the approved articles
  speak-global-news:
    needs: plan
    if: needs.plan.outputs.gn_matrix != '[]' && needs.plan.outputs.gn_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.gn_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-${{ env.SUPERTONIC_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Read first-wave batch ${{ matrix.batch }} aloud
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python bb_audio.py speak --wave gn --batch ${{ matrix.batch }}

  # Before the brief is published: tell the final check what's read, so Listen goes live with it
  note-ready:
    needs: [plan, speak-global-news]
    if: always() && needs.plan.outputs.source == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3
      - name: Tell the final check which approved articles are read
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python bb_audio.py ready

  # Listen appears on today's app as soon as Global News is read, not after every topic.
  label-global-news:
    needs: [plan, speak-global-news]
    if: always() && needs.plan.outputs.source == 'brief'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3
      - name: Label the live brief with its audio
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python bb_audio.py label

  speak-other-topics:
    needs: [plan, speak-global-news]
    if: always() && needs.plan.outputs.rest_matrix != '[]' && needs.plan.outputs.rest_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.rest_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-${{ env.SUPERTONIC_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Read batch ${{ matrix.batch }} aloud
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python bb_audio.py speak --wave rest --batch ${{ matrix.batch }}

  check:
    needs: [plan, label-global-news, speak-other-topics]
    # Also when nothing was left to read (a backup run), so a missed labelling is retried.
    if: always() && needs.plan.outputs.source == 'brief'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install boto3 num2words
      - name: Label the live brief with its audio
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python bb_audio.py label
      - name: Every article has audio? Delete old days
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python bb_audio.py check
